name: Actualizar resultados oficiales FAM

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fam-results-snapshot.yml"
      - "scripts/fam-results-snapshot.mjs"
      - "workers/results-collector/**"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  id-token: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Obtener credencial temporal de GitHub
        uses: actions/github-script@v9
        with:
          script: |
            const token = await core.getIDToken('club-atletas-results-collector')
            core.setSecret(token)
            core.exportVariable('FAM_INGEST_TOKEN', token)
      - name: Leer e importar resultados FAM
        run: |
          if ! FAM_IMPORT_RESULT="$(node scripts/fam-results-snapshot.mjs 2>fam-import-error.log)"; then
            while IFS= read -r line; do echo "::error title=Importación FAM::$line"; done < fam-import-error.log
            exit 1
          fi
          echo "::notice title=Importación FAM::$FAM_IMPORT_RESULT"
