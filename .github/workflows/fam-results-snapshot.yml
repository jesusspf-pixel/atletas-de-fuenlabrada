name: Actualizar resultados oficiales FAM

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fam-results-snapshot.yml"
      - "scripts/fam-results-snapshot.mjs"
      - "workers/results-collector/**"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  id-token: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Leer e importar resultados FAM
        run: |
          if ! FAM_INGEST_TOKEN="$(curl --fail --silent --show-error -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=club-atletas-results-collector" | jq -er .value)"; then
            echo "::error title=Importación FAM::No se pudo obtener la credencial temporal de GitHub."
            exit 1
          fi
          export FAM_INGEST_TOKEN
          if ! node scripts/fam-results-snapshot.mjs 2>fam-import-error.log; then
            while IFS= read -r line; do echo "::error title=Importación FAM::$line"; done < fam-import-error.log
            exit 1
          fi
