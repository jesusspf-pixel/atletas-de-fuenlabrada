name: Actualizar resultados oficiales FAM

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read
  id-token: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Obtener credencial temporal para el recolector
        run: |
          echo "FAM_INGEST_TOKEN=$(curl --fail --silent --show-error -H \"Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN\" \"$ACTIONS_ID_TOKEN_REQUEST_URL&audience=club-atletas-results-collector\" | jq -r .value)" >> "$GITHUB_ENV"
      - run: node scripts/fam-results-snapshot.mjs
