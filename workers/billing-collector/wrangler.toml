name = "club-atletas-billing-collector"
main = "src/index.js"
compatibility_date = "2026-09-10"

# Cada minuto, en lotes pequeños: procesa picos de cuotas sin superar el límite
# de subpeticiones externas de Workers Free.
[triggers]
crons = ["* * * * *"]

[observability]
enabled = true
head_sampling_rate = 1
