<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Volver a Atletas de Fuenlabrada</title>
    <style>
      :root{font-family:Inter,system-ui,sans-serif;color:#0b1930;background:#edf4fb}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:22px;box-sizing:border-box}.card{width:min(440px,100%);padding:30px;border-radius:24px;background:#fff;box-shadow:0 18px 50px #0b376522;text-align:center}.brand{font-weight:900;color:#125cb4;letter-spacing:.08em}.spinner{width:40px;height:40px;margin:24px auto;border:4px solid #d8e7f7;border-top-color:#1767bd;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}a{display:block;margin-top:20px;padding:13px 18px;border-radius:12px;background:#1767bd;color:#fff;text-decoration:none;font-weight:800}p{line-height:1.55;color:#52657a}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">CLUB ATLETAS DE FUENLABRADA</div>
      <div class="spinner" aria-hidden="true"></div>
      <h1>Volviendo a la aplicación</h1>
      <p>La tarjeta ya se ha procesado. Regresa a la aplicación para terminar la inscripción.</p>
      <a id="open-app" href="#">Volver a la aplicación</a>
    </main>
    <script>
      const target = `com.sportmed.atletasdefuenlabrada://stripe-return${window.location.search}`;
      document.getElementById("open-app").href = target;
      window.location.replace(target);
    </script>
  </body>
</html>
