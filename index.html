<!doctype html>
<html lang="es">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1930" />
    <meta name="description" content="Club Atletas de Fuenlabrada: familias, atletas y equipo técnico." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Club Atletas de Fuenlabrada</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ("serviceWorker" in navigator) {
        let reloadingForUpdate = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (reloadingForUpdate) return;
          reloadingForUpdate = true;
          window.location.reload();
        });
        navigator.serviceWorker.register("/sw.js?v=20260826-2", { updateViaCache: "none" })
          .then((registration) => {
            registration.update();
            window.setInterval(() => registration.update(), 15 * 60 * 1000);
          })
          .catch(() => undefined);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script src="/auth-recovery.js?v=20260824-2" defer></script>
  </body>
</html>
