<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1930" />
    <meta name="description" content="Club Atletas de Fuenlabrada: familias, atletas y equipo técnico." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" />
    <title>Club Atletas de Fuenlabrada</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Se desactiva temporalmente la caché offline para impedir que una PWA
      // instalada conserve una versión antigua de la aplicación.
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations()
          .then((registrations) => Promise.all(registrations.map((registration) => registration.unregister())))
          .catch(() => undefined);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script src="/auth-recovery.js" defer></script>
  </body>
</html>
